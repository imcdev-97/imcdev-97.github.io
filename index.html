<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quebra-cabeça</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f8;--ink:#10252e;--mute:#5b6f78;--card:#ffffff;--acc:#0f766e;--accink:#ffffff;--gap:#dbe5ea;--star:#d98a00;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b21;--ink:#e8f1f4;--mute:#8aa2ac;--card:#15292f;--acc:#2dd4bf;--accink:#06201d;--gap:#1d353d;--star:#fbbf24}}
:root[data-theme="dark"]{--bg:#0d1b21;--ink:#e8f1f4;--mute:#8aa2ac;--card:#15292f;--acc:#2dd4bf;--accink:#06201d;--gap:#1d353d;--star:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 16px 28px}
.hidden{display:none!important}
.wrap{width:100%;max-width:440px}
h1{font-size:1.6rem;margin:8px 0 2px}
p.sub{margin:0 0 16px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{background:var(--card);border:0;border-radius:16px;padding:8px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:block;width:100%}
.lv .pic{aspect-ratio:1;border-radius:11px;background-size:100% 100%;position:relative}
.lv b{display:block;margin:8px 4px 0}
.lv small{display:flex;justify-content:space-between;margin:2px 4px 4px;color:var(--mute)}
.lv .st{color:var(--star);letter-spacing:1px}
.lv[disabled]{cursor:default}
.lv[disabled] .pic{filter:grayscale(1) brightness(.45)}
.lv[disabled] .pic::after{content:"Bloqueada";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.lv:focus-visible,button:focus-visible{outline:3px solid var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.top h2{margin:0;font-size:1.15rem}
.top small{color:var(--mute)}
.stats{display:flex;gap:18px;margin-bottom:12px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--mute)}
#board{position:relative;width:100%;aspect-ratio:1;background:var(--gap);border-radius:14px;overflow:hidden;touch-action:manipulation}
.tile{position:absolute;background-image:var(--img);cursor:pointer;transition:left .14s ease,top .14s ease;box-shadow:inset 0 0 0 2px var(--bg);user-select:none}
.tile span{display:block;margin:7px 0 0 9px;font-weight:700;font-size:.95rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.tile:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
#board.won .tile{box-shadow:none}#board.won .tile span{display:none}
.row{display:flex;gap:10px;margin-top:14px}
button.b{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 14px;cursor:pointer;flex:1;background:var(--card);color:var(--ink)}
button.main{background:var(--acc);color:var(--accink)}
#msg{min-height:1.6em;margin-top:14px;font-weight:700;color:var(--acc);text-align:center}
#msg .st{color:var(--star);font-size:1.5rem;display:block}
</style>
</head>
<body>
<div class="wrap" id="menu">
  <h1>Quebra-cabeça</h1>
  <p class="sub" id="total"></p>
  <div class="grid" id="grid"></div>
</div>

<div class="wrap hidden" id="game">
  <div class="top">
    <div><h2 id="gname"></h2><small id="ginfo"></small></div>
    <button class="b" id="back" style="flex:0 0 auto">Fases</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="moves">0</b><span>movimentos</span></div>
    <div class="stat"><b id="time">0:00</b><span>tempo</span></div>
  </div>
  <div id="board" role="grid" aria-label="Tabuleiro"></div>
  <div id="msg" aria-live="polite"></div>
  <div class="row">
    <button class="b" id="again">Embaralhar</button>
    <button class="b main hidden" id="next">Próxima fase</button>
  </div>
</div>

<script>
const L=[
{name:'Pôr do sol',n:3,img:'radial-gradient(circle at 72% 60%,#fff6c2 0 7%,#ffd166 7.5% 11%,transparent 11.5%),radial-gradient(circle at 20% 18%,#fff 0 1%,transparent 1.5%),radial-gradient(circle at 45% 10%,#fff 0 .8%,transparent 1.3%),radial-gradient(circle at 85% 22%,#fff 0 1%,transparent 1.5%),linear-gradient(160deg,transparent 0 66%,#0b4f4a 66.2% 78%,#06302d 78.2%),linear-gradient(180deg,#1d2b6e 0%,#7c3aed 30%,#ea580c 58%,#fbbf24 68%,#0f766e 68.1%,#0a3d3a 100%)'},
{name:'Luar',n:3,img:'radial-gradient(circle at 70% 28%,#fffbe6 0 9%,#f1e9c0 9.5% 12%,transparent 12.5%),radial-gradient(circle at 15% 15%,#fff 0 1%,transparent 1.5%),radial-gradient(circle at 40% 32%,#fff 0 .8%,transparent 1.3%),radial-gradient(circle at 90% 60%,#fff 0 .8%,transparent 1.3%),radial-gradient(ellipse 70% 30% at 25% 105%,#0b1a2e 0 98%,transparent 100%),radial-gradient(ellipse 60% 25% at 85% 100%,#14283f 0 98%,transparent 100%),linear-gradient(180deg,#050b1f,#1b2f66 70%,#3b5a9a)'},
{name:'Praia',n:4,img:'radial-gradient(circle at 20% 22%,#fff7b0 0 8%,#ffe14d 8.5% 11%,transparent 11.5%),radial-gradient(ellipse 25% 5% at 70% 20%,#fff 0 98%,transparent 100%),linear-gradient(180deg,transparent 0 76%,#fff 76% 78.5%,transparent 78.5%),linear-gradient(180deg,transparent 0 55%,#1fb6c9 55% 78%,#f2d49b 78% 100%),linear-gradient(180deg,#5cc3f0,#bfe9fb 55%)'},
{name:'Deserto',n:4,img:'radial-gradient(circle at 78% 24%,#fff3c4 0 7%,#ffd27a 7.5% 10%,transparent 10.5%),radial-gradient(ellipse 80% 28% at 20% 100%,#c2410c 0 98%,transparent 100%),radial-gradient(ellipse 70% 24% at 85% 98%,#9a3412 0 98%,transparent 100%),radial-gradient(ellipse 90% 20% at 50% 78%,#ea8a3c 0 98%,transparent 100%),linear-gradient(180deg,#f9a86a,#fcd9a0 70%)'},
{name:'Aurora',n:5,img:'radial-gradient(circle at 12% 12%,#fff 0 .9%,transparent 1.4%),radial-gradient(circle at 55% 8%,#fff 0 .9%,transparent 1.4%),radial-gradient(circle at 92% 18%,#fff 0 .9%,transparent 1.4%),radial-gradient(ellipse 120% 22% at 50% 100%,#e8f4ff 0 98%,transparent 100%),linear-gradient(115deg,transparent 15%,rgba(52,211,153,.8) 35%,rgba(168,85,247,.75) 55%,transparent 75%),linear-gradient(180deg,#040a1e,#0b2a4a 75%)'},
{name:'Floresta',n:5,img:'radial-gradient(circle at 80% 18%,#fff 0 6%,#fdf1c7 6.5% 9%,transparent 9.5%),radial-gradient(ellipse 45% 40% at 15% 95%,#14532d 0 98%,transparent 100%),radial-gradient(ellipse 40% 55% at 60% 100%,#166534 0 98%,transparent 100%),radial-gradient(ellipse 50% 35% at 95% 100%,#0f3d22 0 98%,transparent 100%),radial-gradient(ellipse 60% 22% at 40% 70%,#4d9a63 0 98%,transparent 100%),linear-gradient(180deg,#bfe3d0,#e9f5ec 60%)'},
{name:'Cidade',n:4,img:'radial-gradient(circle at 22% 70%,#ffd166 0 .9%,transparent 1.4%),radial-gradient(circle at 22% 88%,#ffd166 0 .9%,transparent 1.4%),radial-gradient(circle at 60% 75%,#ffd166 0 .9%,transparent 1.4%),radial-gradient(circle at 82% 65%,#ffd166 0 .9%,transparent 1.4%),radial-gradient(circle at 82% 82%,#ffd166 0 .9%,transparent 1.4%),radial-gradient(circle at 40% 86%,#ffd166 0 .9%,transparent 1.4%),radial-gradient(ellipse 7% 48% at 22% 100%,#1b1640 0 98%,transparent 100%),radial-gradient(ellipse 9% 40% at 60% 100%,#1b1640 0 98%,transparent 100%),radial-gradient(ellipse 8% 55% at 82% 100%,#1b1640 0 98%,transparent 100%),radial-gradient(ellipse 10% 30% at 40% 100%,#241d55 0 98%,transparent 100%),radial-gradient(circle at 75% 15%,#fff 0 5%,transparent 5.5%),linear-gradient(180deg,#120b35,#5b2a86 60%,#e8607a)'},
{name:'Montanhas',n:4,img:'radial-gradient(circle at 80% 16%,#fff 0 4%,#ffe9a8 4.5% 7%,transparent 7.5%),radial-gradient(ellipse 12% 8% at 70% 38%,#fff 0 98%,transparent 100%),radial-gradient(ellipse 10% 7% at 25% 53%,#fff 0 98%,transparent 100%),radial-gradient(ellipse 80% 18% at 50% 108%,#2d5a3d 0 98%,transparent 100%),radial-gradient(ellipse 45% 50% at 25% 100%,#5b6b8c 0 98%,transparent 100%),radial-gradient(ellipse 50% 65% at 70% 100%,#3f4d6e 0 98%,transparent 100%),linear-gradient(180deg,#7fb2e5,#e6f1fb)'},
{name:'Fundo do mar',n:5,img:'radial-gradient(circle at 20% 30%,rgba(255,255,255,.7) 0 2%,transparent 2.5%),radial-gradient(circle at 28% 45%,rgba(255,255,255,.6) 0 1.5%,transparent 2%),radial-gradient(circle at 75% 25%,rgba(255,255,255,.6) 0 1.8%,transparent 2.3%),radial-gradient(ellipse 8% 14% at 62% 55%,#ff8a3d 0 98%,transparent 100%),radial-gradient(ellipse 5% 7% at 36% 70%,#fde047 0 98%,transparent 100%),radial-gradient(ellipse 14% 22% at 15% 100%,#e11d74 0 98%,transparent 100%),radial-gradient(ellipse 12% 30% at 85% 100%,#a21caf 0 98%,transparent 100%),radial-gradient(ellipse 70% 10% at 50% 106%,#e7c98a 0 98%,transparent 100%),linear-gradient(180deg,#0ea5e9,#0c4a6e 55%,#082f49)'},
{name:'Campo de flores',n:5,img:'radial-gradient(circle at 18% 72%,#ef4444 0 2.5%,transparent 3%),radial-gradient(circle at 40% 80%,#fde047 0 2.5%,transparent 3%),radial-gradient(circle at 62% 70%,#f472b6 0 2.5%,transparent 3%),radial-gradient(circle at 80% 84%,#fff 0 2.5%,transparent 3%),radial-gradient(circle at 30% 92%,#a855f7 0 2.5%,transparent 3%),radial-gradient(circle at 88% 66%,#ef4444 0 2.5%,transparent 3%),radial-gradient(circle at 72% 18%,#fff7b0 0 7%,#ffe14d 7.5% 10%,transparent 10.5%),radial-gradient(ellipse 90% 30% at 20% 105%,#3f9b4a 0 98%,transparent 100%),radial-gradient(ellipse 80% 30% at 90% 105%,#2f7d3a 0 98%,transparent 100%),radial-gradient(ellipse 100% 28% at 50% 72%,#6cc070 0 98%,transparent 100%),linear-gradient(180deg,#7ec8f2,#d9f0fb)'},
{name:'Vulcão',n:6,img:'radial-gradient(ellipse 18% 9% at 52% 24%,rgba(150,150,150,.65) 0 98%,transparent 100%),radial-gradient(ellipse 10% 4% at 50% 43%,#ffb703 0 98%,transparent 100%),radial-gradient(ellipse 5% 22% at 50% 62%,#ff6a00 0 98%,transparent 100%),radial-gradient(ellipse 45% 60% at 50% 100%,#3b2a28 0 98%,transparent 100%),radial-gradient(ellipse 100% 14% at 50% 106%,#1a1012 0 98%,transparent 100%),linear-gradient(180deg,#2b0f1a,#7a2a1a 55%,#e2703a)'},
{name:'Galáxia',n:6,img:'radial-gradient(circle at 20% 78%,#f97316 0 6%,#7c2d12 6.5% 8%,transparent 8.5%),radial-gradient(circle at 12% 15%,#fff 0 .8%,transparent 1.2%),radial-gradient(circle at 85% 12%,#fff 0 .8%,transparent 1.2%),radial-gradient(circle at 90% 70%,#fff 0 .8%,transparent 1.2%),radial-gradient(circle at 35% 35%,#fff 0 .6%,transparent 1%),radial-gradient(circle at 50% 50%,#fff7d6 0 3%,#f9c74f 3.5% 7%,transparent 20%),conic-gradient(from 20deg at 50% 50%,rgba(168,85,247,0),rgba(168,85,247,.75),rgba(56,189,248,0) 25%,rgba(236,72,153,.75) 50%,rgba(56,189,248,0) 75%,rgba(168,85,247,0)),radial-gradient(circle at 50% 50%,#1e1b4b,#030014 72%)'}
];
const PAR={3:30,4:80,5:150,6:250};
const $=id=>document.getElementById(id),board=$('board');
let save={};try{save=JSON.parse(localStorage.getItem('qc-fases')||'{}')}catch(e){}
function persist(){try{localStorage.setItem('qc-fases',JSON.stringify(save))}catch(e){}}
const stars=k=>'★'.repeat(k)+'☆'.repeat(3-k);
let cur=0,n=3,a=[],tiles=[],moves=0,t0=0,timer=null,won=false;

function unlocked(i){return i===0||save[i-1]>0}
function renderMenu(){
  const g=$('grid');g.innerHTML='';let tot=0;
  L.forEach((l,i)=>{
    const s=save[i]||0;tot+=s;
    const b=document.createElement('button');b.className='lv';b.disabled=!unlocked(i);
    b.innerHTML='<div class="pic" style="background-image:'+l.img+'"></div><b>'+(i+1)+'. '+l.name+'</b><small><span>'+l.n+' × '+l.n+'</span><span class="st">'+stars(s)+'</span></small>';
    b.onclick=()=>play(i);g.appendChild(b);
  });
  $('total').textContent=tot+' de '+L.length*3+' estrelas';
}
function show(v){$('menu').classList.toggle('hidden',v!=='menu');$('game').classList.toggle('hidden',v!=='game');window.scrollTo(0,0)}

function build(){
  board.innerHTML='';tiles=[];board.classList.remove('won');
  board.style.setProperty('--img',L[cur].img);
  const sz=100/n+'%';
  for(let v=0;v<n*n-1;v++){
    const t=document.createElement('div');t.className='tile';t.tabIndex=0;t.setAttribute('role','gridcell');
    t.style.width=t.style.height=sz;t.style.backgroundSize=n*100+'% '+n*100+'%';
    t.style.backgroundPosition=((v%n)/(n-1)*100)+'% '+((v/n|0)/(n-1)*100)+'%';
    t.innerHTML='<span>'+(v+1)+'</span>';
    t.onclick=()=>move(v);
    t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();move(v)}};
    board.appendChild(t);tiles[v]=t;
  }
}
function place(){a.forEach((v,i)=>{if(v===n*n-1)return;const t=tiles[v];t.style.left=(i%n)*100/n+'%';t.style.top=(i/n|0)*100/n+'%'})}
function fmt(s){return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function tick(){$('time').textContent=fmt(Math.floor((Date.now()-t0)/1000))}
function shuffle(){
  const B=n*n-1;a=[...Array(n*n).keys()];let b=B,prev=-1;
  for(let k=0;k<n*n*30;k++){
    const r=b/n|0,c=b%n,opts=[];
    if(r>0)opts.push(b-n);if(r<n-1)opts.push(b+n);if(c>0)opts.push(b-1);if(c<n-1)opts.push(b+1);
    const o=opts.filter(x=>x!==prev),p=o[Math.random()*o.length|0];
    a[b]=a[p];a[p]=B;prev=b;b=p;
  }
  if(a.every((v,i)=>v===i))shuffle();
}
function start(){
  clearInterval(timer);won=false;moves=0;t0=0;
  $('moves').textContent=0;$('time').textContent='0:00';$('msg').textContent='';$('next').classList.add('hidden');
  build();shuffle();place();
}
function play(i){
  cur=i;n=L[i].n;$('gname').textContent=(i+1)+'. '+L[i].name;
  $('ginfo').textContent=n+' × '+n+' · 3 estrelas até '+PAR[n]+' movimentos';
  show('game');start();
}
function move(v){
  if(won)return;
  const B=n*n-1,i=a.indexOf(v),b=a.indexOf(B),r=i/n|0,c=i%n,br=b/n|0,bc=b%n;
  if(r!==br&&c!==bc)return;
  if(!t0){t0=Date.now();timer=setInterval(tick,500)}
  const step=r===br?(c<bc?1:-1):(r<br?n:-n);
  for(let k=b;k!==i;k-=step)a[k]=a[k-step];
  a[i]=B;moves++;$('moves').textContent=moves;place();
  if(a.every((x,j)=>x===j))win();
}
function win(){
  won=true;clearInterval(timer);tick();
  const last=document.createElement('div');last.className='tile';
  last.style.width=last.style.height=100/n+'%';last.style.left=last.style.top=(n-1)*100/n+'%';
  last.style.backgroundSize=n*100+'% '+n*100+'%';last.style.backgroundPosition='100% 100%';
  board.appendChild(last);board.classList.add('won');
  const k=moves<=PAR[n]?3:moves<=PAR[n]*1.7?2:1;
  if(k>(save[cur]||0)){save[cur]=k;persist()}
  $('msg').innerHTML='<span class="st">'+stars(k)+'</span>Fase concluída em '+moves+' movimentos e '+$('time').textContent;
  if(cur<L.length-1)$('next').classList.remove('hidden');
  else $('msg').innerHTML+='<br>Você completou todas as fases!';
}
$('back').onclick=()=>{clearInterval(timer);renderMenu();show('menu')};
$('again').onclick=start;
$('next').onclick=()=>play(cur+1);
renderMenu();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
